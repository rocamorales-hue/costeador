<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Costeador - Café Sierra Escondida</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .navbar-brand { font-weight: bold; color: #4e342e !important; }
        .table-container { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-light bg-light shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">☕ Café Sierra Escondida | Panel de Costos</a>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <div class="container">
        <div class="table-container">
            <h4 class="mb-3">Costo Directo por Bebida</h4>
            
            <!-- Indicador de carga -->
            <div id="loader" class="text-center my-4">
                <div class="spinner-border text-secondary" role="status">
                    <span class="visually-hidden">Cargando datos...</span>
                </div>
                <p class="mt-2 text-muted">Sincronizando con Google Sheets...</p>
            </div>

            <!-- Tabla de datos (Oculta por defecto hasta que carguen los datos) -->
            <div class="table-responsive d-none" id="tableWrapper">
                <table class="table table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>Producto</th>
                            <th class="text-end">Costo Total (MXN)</th>
                        </tr>
                    </thead>
                    <tbody id="tablaCostos">
                        <!-- Las filas se inyectarán aquí con JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Script de lógica -->
    <script src="app.js"></script>
</body>
</html>
